# Jaeger v2: stores the traces the collector's tail sampling keeps, on disk
# (Badger), for JAEGER_TTL (default 48 h). S3 keeps every span for good; this is
# the searchable recent window. Grafana › Explore › Jaeger reads it, and the UI
# is on the box's loopback (ssh -L 16686:127.0.0.1:16686).
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: warn

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: 0.0.0.0:13133
  jaeger_query:
    storage:
      traces: main
    http:
      endpoint: 0.0.0.0:16686
  jaeger_storage:
    backends:
      main:
        badger:
          directories:
            keys: /badger/keys
            values: /badger/values
          ephemeral: false
          ttl:
            spans: ${env:JAEGER_TTL}

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  jaeger_storage_exporter:
    trace_storage: main
