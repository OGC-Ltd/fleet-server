# System checks. Firing ones show on the Fleet · Overview dashboard; nothing is
# paged yet (no Alertmanager): add a Grafana contact point to be told.
#
# Names follow Prometheus's OTLP translation (dots to underscores, unit and
# _total suffixes). Where a suffix depends on the unit the instrumentation
# declares, the rule matches both spellings with __name__.
groups:
  - name: fleet
    rules:
      - alert: FleetServerSilent
        expr: absent_over_time(http_server_request_duration_seconds_count{job="fleet/fleet-server"}[5m])
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: No request metrics from fleet-server for 5 minutes (down, or not sending)

      - alert: Fleet5xxRate
        expr: |
          sum(rate(http_server_request_duration_seconds_count{job="fleet/fleet-server", http_response_status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_request_duration_seconds_count{job="fleet/fleet-server"}[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Over 5 % of API requests failing with 5xx

      - alert: FleetSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="fleet/fleet-server"}[5m]))) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: API p95 over 3 s for 10 minutes

      - alert: FleetPollFallingBehind
        expr: sum by (loop) (increase(fleet_loop_ticks_skipped_total[10m])) > 30
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Poll loop {{ $labels.loop }} skipped over 30 ticks in 10 minutes (runs longer than its interval)'

      - alert: FleetEventLoopDelay
        expr: max({__name__=~"nodejs_eventloop_delay_p99(_seconds)?", job="fleet/fleet-server"}) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: fleet-server event loop p99 delay over 500 ms

  - name: box
    rules:
      - alert: ContainerMemoryHigh
        expr: max by (container_name) ({__name__=~"container_memory_percent(_ratio|_percent)?"}) > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Container {{ $labels.container_name }} over 85 % of its memory limit'

      - alert: BoxDiskLow
        expr: max({__name__=~"system_filesystem_utilization(_ratio)?", mountpoint="/"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Root disk over 85 % full (deploys refuse to pull below 3-4 GiB free)

      - alert: BoxMemoryLow
        expr: max({__name__=~"system_memory_utilization(_ratio)?", state="used"}) > 0.90
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Box memory over 90 % used

  - name: pipeline
    rules:
      - alert: TelemetryExportFailing
        expr: |
          sum by (exporter) (rate({__name__=~"otelcol_exporter_send_failed_(spans|log_records|metric_points)(_total)?"}[10m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: 'Collector exporter {{ $labels.exporter }} failing (S3, Jaeger, Loki or Prometheus not taking data)'
