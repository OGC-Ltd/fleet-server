# Loki, single process, logs on the local volume, searchable for 14 days.
# The collector pushes over OTLP (/otlp/v1/logs): resource attributes such as
# service.name become labels, each line's own fields (ip, status, route, user,
# trace_id ...) become structured metadata, queryable without a parser:
#   {service_name="nginx"} | remote_addr="203.0.113.7"
# S3 keeps every line for good (otel-collector/config.yaml).

auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-11-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 336h
  max_query_lookback: 336h
  allow_structured_metadata: true
  # Every pino line and every nginx request: about 1M lines a day at peak.
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_structured_metadata_entries_count: 128
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes: [log.source]

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
