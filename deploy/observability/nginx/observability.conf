# Installed as /etc/nginx/fleet/observability.conf and included from the HTTPS
# server only (`fleet-observability nginx`): Grafana's sign-in never travels
# over plain HTTP. Jaeger and Prometheus stay on the box's loopback; Grafana
# reads both.

location = /grafana/login {
    limit_req zone=obs_grafana_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /grafana/ {
    proxy_pass http://127.0.0.1:3300;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $obs_connection_upgrade;
    proxy_read_timeout 120s;
}
