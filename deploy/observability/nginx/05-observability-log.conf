# Installed as /etc/nginx/conf.d/05-observability-log.conf (http context) by
# `fleet-observability nginx`. A second access log, in JSON, beside the
# existing access.log (unchanged: other tools read it). The collector reads
# this one: every request that reached the box, with the connecting address
# and how long it took.
#
#   remote_addr  the address that connected (the LiteSpeed proxy, for the
#                ogc-monitoring domain; the real client otherwise)
#   xff          X-Forwarded-For as received (client-controlled: never trust it alone)
#   path         the path, with the account-setup token blanked
#                (/api/v1/account/setup/<token>), as src/lib/scrub-query.ts does
#   args         the query string, blanked whole when any parameter looks
#                like a credential (Wialon token/sid, signed URLs, codes)

map $uri $obs_path {
    "~*^(?<obs_head>.*/account/setup/)[^/]+(?<obs_tail>.*)$" "${obs_head}[redacted]${obs_tail}";
    default $uri;
}

map $args $obs_args {
    "~*(^|&)(token|sid|access_token|refresh_token|id_token|api_?key|key|secret|client_secret|password|pass|code|sig|signature|x-amz-signature|x-amz-credential|x-amz-security-token)=" "[redacted]";
    default $args;
}

# Grafana Live uses a WebSocket under /grafana/api/live/.
map $http_upgrade $obs_connection_upgrade {
    default upgrade;
    ''      '';
}

# Grafana's sign-in page, per client: Grafana has its own lockout, this keeps
# guessing slow and cheap.
limit_req_zone $binary_remote_addr zone=obs_grafana_login:1m rate=10r/m;

log_format fleet_json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for",'
    '"host":"$host",'
    '"server_port":"$server_port",'
    '"scheme":"$scheme",'
    '"method":"$request_method",'
    '"path":"$obs_path",'
    '"args":"$obs_args",'
    '"protocol":"$server_protocol",'
    '"status":"$status",'
    '"bytes_sent":"$body_bytes_sent",'
    '"request_length":"$request_length",'
    '"request_time":"$request_time",'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_id":"$request_id",'
    '"tls":"$ssl_protocol",'
    '"limit_req":"$limit_req_status"'
'}';

access_log /var/log/nginx/access.json.log fleet_json;
