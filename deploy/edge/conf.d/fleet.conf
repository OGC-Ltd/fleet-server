# Edge sites: the same three servers as the host's /etc/nginx/conf.d/fleet.conf
# (2026-11-03), on the container's unprivileged ports. Host 80 -> 8080, 443 -> 8443.
#
#   https://logistics.raioperations.com  -> the site (Let's Encrypt, certbot webroot)
#   http://logistics.raioperations.com   -> 301 to https
#   http://<anything else, incl. the IP> -> the site over plain HTTP, unchanged:
#       the LiteSpeed proxy for fleettracking.ogc-monitoring.com and the deploy
#       workflow's served-bundle check both reach the box this way.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }

    include /etc/nginx/fleet/locations.conf;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name logistics.raioperations.com;

    # Renewals are answered over HTTP, so this must stay ahead of the redirect.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type text/plain; }

    # $host, not the container port: the client came in on 80.
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name logistics.raioperations.com;

    ssl_certificate     /etc/letsencrypt/live/logistics.raioperations.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logistics.raioperations.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/fleet/locations.conf;
}
