# Per-client request limits for the two unauthenticated POST targets: the
# password sign-in and the provider webhooks. The app limits both as well
# (per account and per client, in Redis); this stops a flood at nginx before
# it costs a Node request. Over the limit: 429, logged at warn in error.log.
#
# Measured 2026-11-16 (one day of access.log), so the limits sit well clear:
#   sign-in   at most 7 a minute from one address (the office's shared IP)
#   webhooks  FactorySuite (one address) bursts to 12 a second, 234 a minute
#
# The LiteSpeed proxy in front of fleettracking.ogc-monitoring.com
# (198.38.90.19) carries many users from one address. An empty key is not
# limited, so its traffic is left to the app, which tells its users apart
# (TRUSTED_PROXY_IPS). If that proxy's address changes, change it here too.
map $remote_addr $fleet_rl_client {
    198.38.90.19  "";
    default       $binary_remote_addr;
}

limit_req_zone $fleet_rl_client zone=fleet_signin:10m  rate=20r/m;
limit_req_zone $fleet_rl_client zone=fleet_webhook:10m rate=30r/s;
limit_req_status    429;
limit_req_log_level warn;
