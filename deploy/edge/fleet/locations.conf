# Shared by the plain-HTTP default site and the HTTPS site in conf.d/fleet.conf.
# Same routes as the host's /etc/nginx/fleet/locations.conf; the static files
# now come from the `web` container, which sets their cache headers itself.
#
# Upstreams are variables so nginx re-resolves them (see `resolver` in
# nginx.conf). A proxy_pass with a variable and no URI part passes the request
# URI through unchanged, which is what both routes did before.
set $fleet_server http://server:3000;
set $fleet_web    http://web:8080;

# Controltech EA alert callbacks: the full /webhook/rai URI reaches the app.
location /webhook/ {
    proxy_pass $fleet_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# REST API and the SSE stream (EventSource -> /api/v1/organisations/<id>/live).
location /api/ {
    proxy_pass $fleet_server;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';      # keep the upstream connection open
    proxy_buffering off;                 # stream SSE events immediately
    proxy_read_timeout 3600s;            # do not drop idle SSE connections
}

# Everything else is the new-ui site.
location / {
    proxy_pass $fleet_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
}
