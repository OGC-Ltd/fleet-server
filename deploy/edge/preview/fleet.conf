# Preview only (deploy/box/fleet-preview): the edge on plain HTTP, no TLS and
# no certificates, published on 127.0.0.1:3001. The same routes as production
# (fleet/locations.conf): the site from `web`, /api and /webhook from `server`,
# which in the preview is the read-only shadow on 127.0.0.1:4001.
server {
    listen 8080 default_server;
    server_name _;
    include /etc/nginx/fleet/locations.conf;
}
