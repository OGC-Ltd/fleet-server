# Edge container (nginxinc/nginx-unprivileged): runs as uid 101 with no Linux
# capabilities, listening on 8080/8443; compose maps host 80/443 onto those.
# Mirrors the host /etc/nginx/nginx.conf of 2026-11-03, minus the parts an
# unprivileged process cannot or need not do (user, pid in /run, rlimit:
# compose sets `ulimits: nofile` instead of worker_rlimit_nofile).
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  16384;   # each SSE viewer holds two; see the 2026-10-06 load test
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    # Writable temp paths live on the container's /tmp tmpfs (root fs is read-only).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile           on;
    keepalive_timeout  65;

    # Docker's DNS. Upstreams are named through variables so nginx looks them up
    # again after a redeploy gives a container a new address, instead of
    # holding the old one until the edge itself restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
