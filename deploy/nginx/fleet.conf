# fleet-server + dash, single origin.
#   dash  -> static files from the Vite build
#   /api/ -> node (pm2) on :3000, REST and the live SSE stream
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /home/ubuntu/prod/dash/build;
    index index.html;

    # Vite content-hashes every asset filename, so these are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is the one filename that never changes - it points at each
    # deploy's hashed bundles, so a cached copy pins the browser to the
    # previous release indefinitely.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Controltech EA alert callbacks. No trailing path on proxy_pass, so the
    # full /webhook/rai URI reaches the app unchanged.
    location /webhook/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # REST API and the SSE stream (EventSource -> /api/v1/organisations/<id>/live).
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';      # keep the upstream connection open
        proxy_buffering off;                 # stream SSE events immediately
        proxy_read_timeout 3600s;            # do not drop idle SSE connections
    }
}
