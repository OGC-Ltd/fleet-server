# `fleet-preview` only (deploy/box/fleet-preview): the container stack running
# BESIDE the live pm2 server and host nginx, never instead of them.
#   site (edge -> web, /api -> server)   :3001
#   API  (server directly)               :4001
# Bound to 127.0.0.1 unless fleet-preview sets PREVIEW_ADDR=0.0.0.0, which it
# does only after its firewall chain admits nobody but /etc/fleet/preview.allow.
# The server reads /etc/fleet/shadow.env: read-only database sessions, no
# outside credential, no Redis, every background job off, so it cannot poll,
# alert, mail or write. No report-worker (it needs Redis) and no certbot.
# restart "no": after a reboot, fleet-preview-resume.service puts the firewall
# back BEFORE it starts these, so an exposed preview never comes up ungated.
services:
  server:
    restart: "no"
    ports: !override
      - "${PREVIEW_ADDR:-127.0.0.1}:4001:3000"
  web:
    restart: "no"
    ports: !reset []
  edge:
    restart: "no"
    ports: !override
      - "${PREVIEW_ADDR:-127.0.0.1}:3001:8080"
    volumes: !override
      - ./deploy/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/edge/preview:/etc/nginx/conf.d:ro
      - ./deploy/edge/fleet:/etc/nginx/fleet:ro
