# Phase 0 of docs/containerization-plan.md: build, scan and publish images.
# Deploys nothing: the box still runs pm2 through deploy.yml until phase 2.
#
# Each commit on main gives two images in Amazon ECR (af-south-1, private,
# immutable tags, scanned on push):
#   <account>.dkr.ecr.af-south-1.amazonaws.com/fleet-server:<sha>          server + report-worker
#   <account>.dkr.ecr.af-south-1.amazonaws.com/fleet-server:<sha>-migrate  one-off `prisma migrate deploy`
# An image is pushed only after it boots and Trivy finds no fixable HIGH or
# CRITICAL issue. AWS access is per run via GitHub OIDC: the role in the
# repository variable AWS_ECR_PUSH_ROLE_ARN trusts only main of this repo and
# can only push to these repositories. No AWS keys are stored in GitHub.
# Until that variable exists, the run builds, tests and scans, then skips the
# push with a notice. Setup: the "Fleet ECR Setup" runbook.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fleet-server-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: fleet-server          # local name for build, test and scan
  AWS_REGION: af-south-1
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  image:
    name: build, scan, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # GitHub OIDC token, exchanged for the ECR push role
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build the runtime image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: build the migrate image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-migrate
          cache-from: type=gha,scope=runtime

      - name: images run as non-root, carry no .env, no npm, no Prisma CLI in runtime
        run: |
          set -euo pipefail
          rt="${IMAGE}:${GITHUB_SHA}"; mg="${IMAGE}:${GITHUB_SHA}-migrate"
          for img in "$rt" "$mg"; do
            user=$(docker image inspect -f '{{.Config.User}}' "$img")
            [ "$user" = "10001:10001" ] || { echo "::error::$img runs as '$user', expected 10001:10001"; exit 1; }
          done
          docker run --rm --entrypoint sh "$rt" -c '
            set -e
            ! ls -a /app | grep -qE "^\.env"            || { echo "::error::.env inside the image"; exit 1; }
            ! command -v npm >/dev/null                   || { echo "::error::npm is in the image"; exit 1; }
            [ ! -e /app/node_modules/prisma ]             || { echo "::error::Prisma CLI is in the runtime image"; exit 1; }
            [ ! -e /app/node_modules/typescript ]         || { echo "::error::typescript is in the runtime image"; exit 1; }
            echo "runtime: user $(id -u), no .env, no npm, no Prisma CLI"'

      - name: boot test against a throwaway PostGIS (every background job off)
        run: |
          set -euo pipefail
          rt="${IMAGE}:${GITHUB_SHA}"; mg="${IMAGE}:${GITHUB_SHA}-migrate"
          docker network create --internal boot >/dev/null
          docker run -d --name pg --network boot -e POSTGRES_USER=fleet -e POSTGRES_PASSWORD=boot -e POSTGRES_DB=fleet postgis/postgis:16-3.5-alpine >/dev/null
          # Over TCP, not the socket: the image's init server answers on the socket
          # while it is still creating the postgis extension itself.
          for i in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -U fleet -d fleet >/dev/null 2>&1 && break; sleep 2; done
          docker exec pg psql -h 127.0.0.1 -U fleet -d fleet -tAc "select extversion from pg_extension where extname='postgis'"
          URL=postgresql://fleet:boot@pg:5432/fleet
          # The migration history cannot build a database from empty (see the plan),
          # so the schema comes from db push, through the migrate image's own CLI.
          docker run --rm --network boot --read-only --cap-drop ALL --tmpfs /tmp -e HOME=/tmp             -e DIRECT_URL=$URL -e DATABASE_URL=$URL --entrypoint node "$mg"             node_modules/prisma/build/index.js db push --config prisma.config.ts
          {
            echo "DATABASE_URL=$URL"; echo "DIRECT_URL=$URL"
            echo "JWT_SECRET=ci-boot-test-signing-secret-not-a-real-key-0123"
            for f in POLL RAIFACTORYSUITE_POLL VEHICLE_INSIGHT GOOGLE_ROUTING RETENTION_SWEEP NIGHTLY_ROLLUPS                      FUEL_SYNC LIVE_FUEL_WATCH INCIDENT_CAPTURE FUEL_SETTLE FUEL_ADJUDICATION                      PARKED_FALL_VERDICTS TRIP_BUILD REPORT_WORKER; do echo "${f}_ENABLED=false"; done
          } > boot.env
          docker run -d --name app --network boot --read-only --cap-drop ALL --security-opt no-new-privileges             --init --tmpfs /tmp --env-file boot.env "$rt" >/dev/null
          for i in $(seq 1 45); do
            s=$(docker inspect -f '{{.State.Health.Status}}' app 2>/dev/null || echo gone)
            [ "$s" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || break
            sleep 2
          done
          docker logs app 2>&1 | tail -40
          [ "$s" = healthy ] || { echo "::error::the server image did not become healthy ($s)"; exit 1; }
          docker exec app node -e "fetch('http://127.0.0.1:3000/api/v1/sim-clock').then(r=>{console.log('sim-clock',r.status);process.exit(r.ok?0:1)})"
          docker rm -f app pg >/dev/null; docker network rm boot >/dev/null; rm -f boot.env

      - name: scan both images (fail on fixable HIGH/CRITICAL)
        run: |
          set -uo pipefail
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro             -v "${PWD}/.trivyignore.migrate:/trivyignore.migrate:ro" -v trivy-cache:/root/.cache             "${TRIVY_IMAGE}" image --scanners vuln,secret --severity HIGH,CRITICAL             --ignore-unfixed --exit-code 1 --no-progress "$@"; }
          echo "--- runtime: no exceptions"
          trivy "${IMAGE}:${GITHUB_SHA}"; rt=$?
          echo "--- migrate: exceptions in .trivyignore.migrate"
          trivy --ignorefile /trivyignore.migrate "${IMAGE}:${GITHUB_SHA}-migrate"; mg=$?
          [ $rt -eq 0 ] && [ $mg -eq 0 ]

      - name: AWS push role configured?
        id: gate
        env:
          ROLE: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
        run: |
          if [ -n "${ROLE}" ]; then echo "push=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::AWS_ECR_PUSH_ROLE_ARN is not set: images built, tested and scanned, not pushed"; fi

      - name: sign in to AWS (OIDC, this run only)
        if: steps.gate.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: fleet-server-images-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: log in to ECR
        if: steps.gate.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: push with SBOM and provenance
        if: steps.gate.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.ecr.outputs.registry }}/fleet-server:${{ github.sha }}
          cache-from: type=gha,scope=runtime

      - name: push the migrate image
        if: steps.gate.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.ecr.outputs.registry }}/fleet-server:${{ github.sha }}-migrate
          cache-from: type=gha,scope=runtime
