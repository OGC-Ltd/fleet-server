# Phase 0 of docs/containerization-plan.md: build, scan and publish images.
# Deploys nothing: the box still runs pm2 through deploy.yml until phase 2.
#
# Each commit on main gives two private images in GHCR:
#   ghcr.io/ogc-ltd/fleet-server:<sha>          server + report-worker
#   ghcr.io/ogc-ltd/fleet-server:<sha>-migrate  one-off `prisma migrate deploy`
# An image is pushed only after Trivy finds no fixable HIGH or CRITICAL issue.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fleet-server-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ogc-ltd/fleet-server
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  image:
    name: build, scan, push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push to GHCR with this run's short-lived token
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build the runtime image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

      - name: build the migrate image (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}-migrate
          cache-from: type=gha,scope=runtime

      - name: runtime image starts as non-root and has no secrets baked in
        run: |
          set -euo pipefail
          img="${IMAGE}:${GITHUB_SHA}"
          user=$(docker image inspect -f '{{.Config.User}}' "$img")
          [ "$user" = "10001:10001" ] || { echo "::error::image user is '$user', expected 10001:10001"; exit 1; }
          if docker run --rm --entrypoint sh "$img" -c 'ls -a /app' | grep -qE '^\.env'; then
            echo "::error::a .env file is inside the image"; exit 1
          fi
          echo "user $user, no .env in /app"

      - name: scan both images (fail on fixable HIGH/CRITICAL)
        run: |
          set -euo pipefail
          for tag in "${GITHUB_SHA}" "${GITHUB_SHA}-migrate"; do
            echo "--- ${IMAGE}:${tag}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              "${TRIVY_IMAGE}" image --scanners vuln,secret \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              "${IMAGE}:${tag}"
          done

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=runtime

      - name: push the migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}:${{ github.sha }}-migrate
          cache-from: type=gha,scope=runtime
